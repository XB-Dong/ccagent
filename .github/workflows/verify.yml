name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository, types, offline behavior and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify repository
        run: python3 scripts/verify.py
      - name: Check public-source privacy
        run: python3 scripts/verify_public.py
      - name: Use pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: pnpm check
      - name: Run offline tests without model credentials
        run: pnpm test
      - name: Build workbench
        run: pnpm build
